function home(){let w=state.week;return `<section class="card"><div class="line"><div><div class="eyebrow">Your program</div><h2>Week ${w} of 8</h2></div><span class="pill">${phase(w)}</span></div><div class="progress"><div style="width:${Math.max(0,Math.min(100,(actualWeek()-1)/8*100))}%"></div></div><p class="muted">${actualWeek()===0?'Your first training block begins 17 November 2026. Ease back into lifting.':actualWeek()>8?'This eight-week training block is complete. Your Training HQ and workout logs remain available year-round.':`Calendar is currently in week ${actualWeek()}.`}</p><label for="week">View program week</label><select id="week" onchange="setWeek(this.value)">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${w===i+1?'selected':''}>Week ${i+1}</option>`).join('')}</select><div class="note">${w<=2?'Start with Monday, Wednesday and Saturday only. Skip Friday accessories.':w<=4?'Add Friday only if your legs feel fresh. Avoid leg soreness before Thursday.':w===8?'Deload: reduce lifting sets by around 40–50%.':'Keep team sprint quality first; only increase loads when recovering well.'}</div></section><div class="card"><h3>Daily readiness check-in</h3><p class="muted">How are you feeling? Heavy legs after Broncos? Choose recovery over extra lifting.</p><div class="line"><select id="readiness"><option value="">Select how you feel</option><option value="Fresh">Fresh / ready</option><option value="Okay">Okay / manageable</option><option value="Sore">Sore / fatigued</option></select><button class="secondary" onclick="saveReadiness()">Save</button></div><p class="mini" id="readiness-msg"></p></div><h2>Weekly schedule</h2><div class="days">${schedule.map(([day,title,type])=>`<div class="day"><b>${day} <span class="pill" style="float:right">${type}</span></b><small>${title}</small></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Quick start</h3><p>Open a workout to tick off sets and log kilograms. Your entries stay on this device and browser. Export a backup regularly.</p><button class="primary" onclick="workout('upper')">Open Monday workout →</button></div>`}

function workouts(){return `<h2>Gym sessions</h2><div class="note">Weeks 1–2: 3 sessions only, RPE 6–7 and 3–4 reps in reserve. Weeks 3–4: add sets gradually. Weeks 5–7: progress main lifts toward 4–6 reps if recovered. Week 8: deload.</div>${Object.entries(plans).map(([id,p])=>`<div class="card"><h3>${p.title}</h3><p class="muted">${p.subtitle}${state.completed?.[state.week+'-'+id]?' · ✓ Completed':''}</p><button class="secondary" onclick="workout('${id}')">View exercises & log sets →</button></div>`).join('')}`}
function workoutView(){let p=plans[state.workout],w=state.week;return `<button class="secondary" onclick="changeTab('gym')">← All workouts</button><h2 style="margin-top:16px">${p.title}</h2><p>${p.subtitle} · Week ${w}</p><div class="note">Suggested loads are trials based on previous maxes, not current strength. Rest 1–3 min between sets. No failure reps. If soreness affects team sprinting, cut gym volume.</div>${p.items.map((ex,i)=>{let key=`${w}-${state.workout}-${i}`,entry=state.logs[key]||{};let n=Number(ex[1].match(/^\d+/)?.[0]||1);return `<div class="card"><h3>${esc(ex[0])}</h3><div class="muted">${esc(ex[1])} · ${esc(ex[2])}</div><p class="mini">${esc(ex[3])}</p>${Array.from({length:n},(_,j)=>`<div class="setrow"><label>Set ${j+1}</label><input type="number" inputmode="decimal" min="0" step="0.5" aria-label="Weight kg set ${j+1}" placeholder="kg" value="${entry[j]?.kg??''}" onchange="logSet('${key}',${j},'kg',this.value)"><input type="number" inputmode="numeric" min="0" step="1" aria-label="Reps set ${j+1}" placeholder="reps" value="${entry[j]?.reps??''}" onchange="logSet('${key}',${j},'reps',this.value)"><input class="done" type="checkbox" aria-label="Complete set ${j+1}" ${entry[j]?.done?'checked':''} onchange="logSet('${key}',${j},'done',this.checked)"></div>`).join('')}</div>`}).join('')}<button class="primary" onclick="finishWorkout()">Finish workout ✓</button>`}

function nutrition(){let day=today();return `<h2>Nutrition & supplements</h2><div class="grid2"><div class="card"><div class="muted">Protein / day</div><div class="metric">190 g</div></div><div class="card"><div class="muted">Creatine / day</div><div class="metric">5 g</div></div><div class="card"><div class="muted">Hard-day carbs</div><div class="metric">375–470 g</div></div><div class="card"><div class="muted">Weight goal</div><div class="metric">94 kg</div></div></div><div class="card"><h3>Today's checklist</h3>${[['creatine','5 g creatine monohydrate'],['protein','Meet protein target (food + whey if needed)'],['water','Hydrate to thirst / sweat losses'],['food','Eat enough carbs for training'],['sleep','Aim for 8–9 hours sleep']].map(([id,label])=>`<div class="checkline"><input type="checkbox" id="${id}" ${state.supp[day+'-'+id]?'checked':''} onchange="supp('${day}-${id}',this.checked)"><label for="${id}">${label}</label></div>`).join('')}</div><div class="card"><h3>Training-day timing</h3><p><b>Breakfast:</b> protein + creatine.<br><b>Lunch:</b> protein + rice, pasta or potatoes.<br><b>2–3 hours before field:</b> carb-rich meal.<br><b>Before training:</b> banana or snack if needed.<br><b>During:</b> water; electrolytes if hot/sweaty; carbs if long and demanding.<br><b>After:</b> protein + carbohydrates.</p></div><div class="card"><h3>Supplement priorities</h3><p><b>1.</b> Creatine monohydrate, 5 g daily.<br><b>2.</b> Whey protein, enough to supply 25–35 g when food falls short.<br><b>3.</b> Electrolytes for heavy sweat losses.<br><b>Optional:</b> caffeine 100–200 mg only when useful and not close to bedtime.</p><div class="note">Choose exact HASTA/Informed Sport batch-tested supplements when anti-doping rules apply. Avoid high-stimulant blends and unnecessary fat burners.</div></div>`}

function addWeight(){let kg=Number(document.getElementById('bw').value);if(!kg||kg<30||kg>250)return alert('Enter a valid weight in kg');state.weights.push({date:today(),kg});save();render()}
function addTest(){let type=document.getElementById('testtype').value,val=Number(document.getElementById('testval').value);if(!val||val<=0)return alert('Enter a positive result');state.tests.push({date:today(),type,val});save();render()}
function progress(){let vals=state.weights.slice(-10);const lo=vals.length?Math.min(...vals.map(v=>v.kg))-1:90,hi=vals.length?Math.max(...vals.map(v=>v.kg))+1:100;const y=kg=>Math.round(120-90*(kg-lo)/Math.max(1,hi-lo));return `<h2>Progress tracker</h2><div class="card"><h3>Body weight</h3><p class="muted">Goal: stay around 93–95 kg. Record morning weight under similar conditions.</p><div class="line"><input id="bw" type="number" step="0.1" inputmode="decimal" placeholder="94.0"><button class="primary" onclick="addWeight()">Log kg</button></div>${vals.length?`<svg viewBox="0 0 320 150" role="img" aria-label="Body weight trend"><line x1="10" y1="130" x2="310" y2="130" stroke="#a46b42"/><polyline fill="none" stroke="#b0001b" stroke-width="3" points="${vals.map((v,i)=>`${10+i*300/Math.max(1,vals.length-1)},${y(v.kg)}`).join(' ')}"/>${vals.map((v,i)=>`<circle cx="${10+i*300/Math.max(1,vals.length-1)}" cy="${y(v.kg)}" r="4" fill="#b0001b"/>`).join('')}</svg>`:''}<p class="mini">${vals.map(v=>`${v.date}: ${v.kg} kg`).join(' · ')||'No weights logged yet.'}</p></div><div class="card"><h3>Strength and sprint benchmarks</h3><p class="muted">Record a consistent working set or timed sprint. Avoid maximal 1RM tests while rebuilding.</p><div class="line"><select id="testtype"><option>Bench working set (kg)</option><option>Squat working set (kg)</option><option>Trap-bar working set (kg)</option><option>10 m sprint (sec)</option><option>30 m sprint (sec)</option></select><input id="testval" type="number" step="0.01" placeholder="Result"></div><button class="primary" onclick="addTest()">Save result</button>${state.tests.slice(-12).reverse().map(x=>`<div class="line muted"><span>${esc(x.type)}<br><small>${x.date}</small></span><b>${x.val}</b></div>`).join('')||'<p class="mini">No benchmarks logged yet.</p>'}</div><div class="card"><h3>Backup your records</h3><p class="muted">Data is stored only in this browser. Export regularly. Clearing website data or switching devices can erase it.</p><button class="secondary" onclick="exportData()">Export backup JSON ↓</button> <button class="secondary" onclick="document.getElementById('restore').click()">Import backup ↑</button><input class="hidden" type="file" id="restore" accept="application/json" onchange="importData(this)"></div>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='comets-training-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(input){let file=input.files[0];if(!file)return;file.text().then(s=>{let x=JSON.parse(s);if(!x||typeof x!=='object'||!x.logs||!x.weights)throw Error('Invalid backup');if(confirm('Replace current records with this backup?')){state=x;state.club??={players:[],selections:{},matches:[],values:[],season:'2027',round:'Round 1'};club=state.club;

nderstand what is expected of you.'}</p>${p?`<button class="primary" ${current||!club.values.length?'disabled':''} onclick="acknowledgeStandards()">${current?'✓ ACKNOWLEDGED':'I HAVE READ & UNDERSTOOD'}</button>`:'<p class="muted">Select your player profile in the preview switch above.</p>'}</section>`}`;}

// Version 2: demo searches, previous-week references, rest timer, progress graph.
let restRemaining=0,restHandle=null;
function formatRest(sec){return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function restStart(sec){restStop();restRemaining=sec;restPaint();restHandle=setInterval(()=>{restRemaining=Math.max(0,restRemaining-1);restPaint();if(restRemaining===0){restStop();if(navigator.vibrate)navigator.vibrate([120,100,120])}},1000)}
function restStop(){if(restHandle){clearInterval(restHandle);restHandle=null}restRemaining=0;restPaint()}
function restPaint(){const el=document.getElementById('rest-clock');if(el)el.textContent=formatRest(restRemaining)}
function demoUrl(name){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' exercise technique tutorial')}
function previousSets(w,id,i){if(w<2)return null;let v=state.logs[`${w-1}-${id}-${i}`];if(!v)return null;let sets=Object.values(v).filter(x=>x&&x.kg!==undefined&&x.kg!==''&&x.done);if(!sets.length)return null;return sets.map(x=>`${x.kg} kg${x.reps!==undefined&&x.reps!==''?' × '+x.reps:''}`).join(' · ')}
function restTools(){return `<div class="timerbar"><div><div class="mini">REST TIMER</div><strong id="rest-clock">${formatRest(restRemaining)}</strong></div><div class="tools" style="margin:0"><button class="secondary tinybtn" onclick="restStart(60)">1 min</button><button class="secondary tinybtn" onclick="restStart(90)">90 sec</button><button class="secondary tinybtn" onclick="restStart(180)">3 min</button><button class="secondary tinybtn" onclick="restStop()">Stop</button></div></div>`}
function upgradeWorkoutHtml(html){
  html=html.replace('<div class="note">Suggested loads are trials',restTools()+'<div class="note">Suggested loads are trials');
  const parts=html.split('<div class="card"><h3>');
  for(let i=1;i<parts.length;i++){
    const name=plans[state.workout]?.items?.[i-1]?.[0];
    if(!name)continue;
    const prev=previousSets(state.week,state.workout,i-1);
    const addition=`<div class="tools"><a class="exercise-link" target="_blank" rel="noopener noreferrer" href="${demoUrl(name)}">▶ Find technique video ↗</a></div>${prev?`<span class="suggestion">Last week completed: ${prev}. Increase only if technique and recovery were good.</span>`:''}`;
    parts[i]=parts[i].replace('</h3>','</h3>'+addition);
  }
  return parts.join('<div class="card"><h3>');
}
const originalWorkoutView=workoutView;
workoutView=function(){return upgradeWorkoutHtml(originalWorkoutView())};
const originalProgress=progress;
progress=function(){
 let html=originalProgress();
 const types=['Bench working set (kg)','Squat working set (kg)','Trap-bar working set (kg)'];
 const graph=types.map((type)=>{let data=state.tests.filter(x=>x.type===type).slice(-10);if(data.length<2)return '';
 let min=Math.min(...data.map(x=>x.val)),max=Math.max(...data.map(x=>x.val));let range=Math.max(1,max-min),pts=data.map((x,i)=>`${12+i*296/Math.max(1,data.length-1)},${117-(x.val-min)/range*95}`).join(' ');
 return `<div class="card"><h3>${type.replace(' working set (kg)','')} trend</h3><svg viewBox="0 0 320 140" role="img" aria-label="${type} progress chart"><line x1="12" y1="125" x2="308" y2="125" stroke="#ddd"/><polyline fill="none" stroke="#b0001b" stroke-width="3" points="${pts}"/></svg><p class="mini">${data[0].val} kg → ${data[data.length-1].val} kg · ${data.length} logs</p></div>`}).join('');
 return html.replace('<div class="card"><h3>Backup your records</h3>',graph+'<div class="card"><h3>Backup your records</h3>');
};

function profileView(){const p=club.players.find(x=>x.id===selectedProfile);if(!p)return `<div class="card"><h2>Player not found</h2><button onclick="teamSection('squad')">Back to team</button></div>`;const st=club.playerStats[p.id]||{};return `<div class="section-head"><button class="secondary tinybtn" onclick="teamSection('squad')">← Back to squad</button><div class="club-kicker" style="margin-top:15px">PLAYER PROFILE</div><h2>${ce(p.name)}</h2><p>${ce(p.position||'Position not assigned')}</p></div><section class="card"><h3>Player details</h3><label>Full name</label><input id="profile-name" value="${ce(p.name)}"><label>Preferred position(s)</label><input id="profile-position" value="${ce(p.position||'')}"><label>Preferred jersey number</label><input id="profile-jersey" type="number" min="1" max="99" value="${ce(p.jersey||'')}"><label>Coaching notes (stored on this device)</label><textarea id="profile-notes" rows="3">${ce(p.notes||'')}</textarea><button class="primary" onclick="profileSave('${p.id}')">SAVE PROFILE</button></section><section class="card"><h3>Performance overview</h3><div class="profile-metrics">${statMetrics(st)}</div><details><summary>Edit player statistics</summary>${playerStatInputs(p.id,st)}<p class="mini">Enter season totals; per-game averages and tackle efficiency are calculated automatically.</p></details></section>`}

function squadView(){return `<div class="card"><h3>Add a player</h3><div class="club-field"><label for="player-name">Full name</label><input id="player-name" autocomplete="off" placeholder="Player name"></div><div class="club-field"><label for="player-pos">Preferred position(s)</label><input id="player-pos" placeholder="e.g. Prop / second row"></div><button class="primary" onclick="playerAdd()">ADD PLAYER</button></div><section class="card"><div class="line"><h3>First Grade squad</h3><span class="pill">${club.players.length} players</span></div><p class="mini">Tap a player to open their profile and statistics.</p>${club.players.length?club.players.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<div class="club-row"><button class="player-profile-link" onclick="profileOpen('${x.id}')"><b>${ce(x.name)}</b><small>${ce(x.position||'Position not set')}${x.jersey?' · #'+ce(x.jersey):''}</small></button><button class="secondary tinybtn" onclick="playerRemove('${x.id}')">Remove</button></div>`).join(''):'<div class="club-empty">Add your first player above.</div>'}</section>`}

function selectRound(){let input=document.getElementById('round-name').value.trim();if(!input)return;club.round=input;clubSave()}
function pickPlayer(slot,val){club.selections[club.round]??=Array(17).fill('');if(val&&club.selections[club.round].some((id,i)=>i!==slot&&id===val)){alert('That player is already selected.');render();return}club.selections[club.round][slot]=val;clubSave()}
function teamView(){const selected=club.selections[club.round]||Array(17).fill(''),count=selected.filter(Boolean).length;return `<section class="card"><div class="club-kicker">MATCH DAY · 17 PLAYERS</div><h2>Team selection</h2><p class="muted">Pick the starting 13 and four interchange. Saved separately for each round.</p><label>Round / fixture label</label><div class="line"><input id="round-name" value="${ce(club.round)}"><button class="primary" onclick="selectRound()">LOAD</button></div><div class="selection-count">${count}<span> / 17 SELECTED</span></div><div class="selection-heading">STARTING XIII</div>${roles.map((r,i)=>`${i===13?'<div class="selection-heading">INTERCHANGE</div>':''}<div class="team-slot"><span class="jersey-number">${i+1}</span><div class="slot-details"><b>${r}</b><select aria-label="Select ${r}" onchange="pickPlayer(${i},this.value)"><option value="">Choose player</option>${club.players.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${x.id}" ${selected[i]===x.id?'selected':''}>${ce(x.name)}</option>`).join('')}</select></div></div>`).join('')}<div class="tools"><button class="primary" onclick="copyTeam()">COPY TEAM SHEET</button><button class="secondary" onclick="clearTeam()">CLEAR ROUND</button></div></section>`}

function copyTeam(){let ids=club.selections[club.round]||[];let txt=`COFFS HARBOUR COMETS — ${club.round}\n`+roles.map((r,i)=>`${i+1}. ${club.players.find(p=>p.id===ids[i])?.name||'TBC'} (${r})`).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>alert('Team sheet copied.')).catch(()=>prompt('Copy team sheet:',txt));else prompt('Copy team sheet:',txt)}
function clearTeam(){if(confirm('Clear the team selection for this round?')){club.selections[club.round]=Array(17).fill('');clubSave()}}
function matchAdd(){let opponent=document.getElementById('match-opponent').value.trim(),date=document.getElementById('match-date').value,us=document.getElementById('match-us').value,them=document.getElementById('match-them').value,venue=document.getElementById('match-venue').value.trim();if(!opponent||!date)return alert('Add an opponent and date.');if((us!==''||them!=='')&&(us===''||them===''))return alert('Enter both scores or leave both blank for a future fixture.');club.matches.push({id:'m'+Date.now(),opponent,date,venue,us:us===''?null:Number(us),them:them===''?null:Number(them)});clubSave()}
function matchDelete(id){if(confirm('Delete this fixture or result?')){club.matches=club.matches.filter(x=>x.id!==id);if(club.matchPlayerStats)delete club.matchPlayerStats[id];clubSave()}}
function matchStats(){let played=club.matches.filter(x=>x.us!==null&&x.them!==null);return {w:played.filter(x=>x.us>x.them).length,l:played.filter(x=>x.us<x.them).length,d:played.filter(x=>x.us===x.them).length}}
function matchesView(){let stats=matchStats();return `<h2>Match centre</h2><div class="grid2"><div class="card"><div class="muted">Wins</div><div class="metric">${stats.w}</div></div><div class="card"><div class="muted">Losses / Draws</div><div class="metric">${stats.l} / ${stats.d}</div></div></div><div class="card"><h3>Add fixture or result</h3><div class="club-field"><label>Opponent</label><input id="match-opponent" placeholder="Opposition club"></div><div class="club-field"><label>Date</label><input id="match-date" type="date"></div><div class="club-field"><label>Venue (optional)</label><input id="match-venue" placeholder="Home / away ground"></div><div class="line"><div class="club-field" style="flex:1"><label>Comets score</label><input id="match-us" type="number" min="0" placeholder="—"></div><div class="club-field" style="flex:1"><label>Opposition score</label><input id="match-them" type="number" min="0" placeholder="—"></div></div><p class="mini">Leave scores blank for upcoming fixtures.</p><button class="primary" onclick="matchAdd()">Save fixture / result</button></div><div class="card"><h3>Season draw & results</h3>${club.matches.length?club.matches.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="club-row"><div><b>${ce(x.opponent)}</b><div class="club-small">${ce(x.date)}${x.venue?' · '+ce(x.venue):''}</div><div class="club-small">${x.us===null?'Upcoming':x.us>x.them?'Win':x.us<x.them?'Loss':'Draw'}</div></div><div style="text-align:right"><strong>${x.us===null?'VS':`${x.us}–${x.them}`}</strong><div><button class="secondary tinybtn" onclick="matchDelete('${x.id}')">Delete</button></div></div></div>`).join(''):'<div class="club-empty">No fixtures added yet.</div>'}</div>`}
function valueAdd(){let t=document.getElementById('value-text').value.trim();if(!t)return;club.values.push({id:'v'+Date.now(),text:t});clubSave()}
function valueRemove(id){club.values=club.values.filter(x=>x.id!==id);clubSave()}
function standardsView(){return `<h2>Team standards</h2><p class="muted">Write the values, expectations and non-negotiables that define your team.</p><div class="card"><h3>Add a team standard</h3><div class="club-field"><label for="value-text">Value or expectation</label><textarea id="value-text" placeholder="Write your own team standard..."></textarea></div><button class="primary" onclick="valueAdd()">+ Add standard</button></div><div class="card"><h3>Our standards</h3>${club.values.length?club.values.map((x,i)=>`<div class="club-row"><div><b>${i+1}.</b> ${ce(x.text)}</div><button class="secondary tinybtn" onclick="valueRemove('${x.id}')">Remove</button></div>`).join(''):'<div class="club-empty">Add your own values and expectations above.</div>'}</div>`}
function moreView(){return `<h2>My HQ</h2><div class="club-actions"><button onclick="changeTab('gym')">My gym program</button><button onclick="changeTab('nutrition')">Nutrition</button><button onclick="changeTab('progress')">My progress & backup</button><button onclick="changeTab('standards')">Team standards</button></div><div class="card"><h3>Privacy & backup</h3><p class="muted">This first version saves squad lists, selections and results in this browser only. It does not have a login or secure cloud storage. Don't enter sensitive personal details.</p><button class="primary" onclick="exportData()">Export all HQ data</button> <button class="secondary" onclick="document.getElementById('restore-hq').click()">Import backup</button><input class="hidden" type="file" id="restore-hq" accept="application/json" onchange="importData(this)"></div>`}
const oldCometsHome=home;
home=function(){let st=matchStats(),upcoming=club.matches.filter(x=>x.us===null&&x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0],chosen=(club.selections[club.round]||[]).filter(Boolean).length;return `<div class="card"><div class="club-kicker">Your club dashboard</div><h2>Welcome back, Macauley</h2><div class="mini-grid"><div class="tile"><small>Squad</small><strong>${club.players.length}</strong><small>Players listed</small></div><div class="tile"><small>Season record</small><strong>${st.w}–${st.l}–${st.d}</strong><small>Wins · Losses · Draws</small></div></div><p class="muted">${upcoming?'Next fixture: '+ce(upcoming.opponent)+' · '+ce(upcoming.date):'Your next fixture will appear here once added.'}</p><div class="club-actions"><button onclick="changeTab('squad')">Manage squad</button><button onclick="changeTab('team')">Team selection<br><small>${chosen}/17 chosen</small></button><button onclick="changeTab('matches')">Match centre</button><button onclick="changeTab('standards')">Team standards</button></div></div>`};

 let w=state.week;
 return `<div class="section-head"><div class="club-kicker">PERSONAL PERFORMANCE</div><h2>MY TRAINING</h2><p>Strength, conditioning and recovery. Built around your rugby league season.</p></div>
 <div class="training-hero"><div class="training-hero-label">CURRENT TRAINING BLOCK</div><div class="training-hero-title">8-WEEK STRENGTH PROGRAM</div><div class="training-hero-meta">Week ${w} of 8 <span class="training-dot"></span> ${phase(w)}</div><div class="progress"><div style="width:${Math.round(w/8*100)}%"></div></div><button class="hero-action" onclick="changeTab('gym')">VIEW WORKOUTS <span aria-hidden="true">→</span></button></div>
 <div class="training-options">

// Portable backups for club and personal training data. Never upload to a third party.
function exportHQ(){try{const payload={format:'comets-hq-backup',version:2,created:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='comets-hq-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}catch(e){alert('Could not create backup: '+e.message)}}
function importHQ(input){const f=input.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.format!=='comets-hq-backup'||!obj.data||!Array.isArray(obj.data.club?.players)||!obj.data.club?.selections||!Array.isArray(obj.data.club?.matches))throw Error('Not a valid COMETS HQ backup');if(!confirm('Restore this backup? It will REPLACE the data currently stored in this browser. Export a backup first.'))return;localStorage.setItem('rlhq-v1',JSON.stringify(obj.data));alert('Backup restored. The app will reload.');location.reload()}catch(e){alert('Could not restore: '+e.message)}};reader.readAsText(f)}
function backupView(){return `<div class="section-head"><div class="club-kicker">DATA SAFETY</div><h2>BACKUP & RESTORE</h2><p>Download a copy of your club and personal training records before updating the app.</p></div><section class="card"><h3>Export your records</h3><p class="muted">Includes squad, team sheets, match results, training sessions, player stats and personal training logs.</p><button class="primary" onclick="exportHQ()">DOWNLOAD BACKUP (.JSON)</button></section><section class="card"><h3>Restore a backup</h3><p class="muted">Restoring replaces all data saved in this browser. Back up your current records first.</p><input type="file" accept=".json,application/json" onchange="importHQ(this)"></section><p class="mini">Each Netlify site address stores its own browser data. A backup lets you move records between sites. The file contains your club data; keep it private.</p>`}
// Club HQ preview: team sub-tabs, team training sessions, player stats.
club.sessions??=[];
club.playerStats??={};
let teamSubtab='squad';
function teamSection(which){teamSubtab=which;changeTab('team')}
function teamCombined(){return `<div class="section-head"><div class="club-kicker">FIRST GRADE · ${ce(club.season)}</div><h2>TEAM</h2></div><div class="inner-tabs">${[['squad','SQUAD'],['selection','SELECTION'],['availability','AVAILABILITY']].map(([id,label])=>`<button class="${teamSubtab===id?'active':''}" onclick="teamSection('${id}')">${label}</button>`).join('')}</div>`+(teamSubtab==='squad'?squadView():teamSubtab==='selection'?teamView():availabilityView())}
function availabilityView(){return `<section class="card"><h2>Player availability</h2><p class="muted">Track availability for upcoming team sessions and match selection.</p>${club.players.length?club.players.map(p=>`<div class="club-row"><b>${ce(p.name)}</b><select onchange="setAvailability('${p.id}',this.value)"><option value="unknown" ${p.availability==='unknown'||!p.availability?'selected':''}>Unconfirmed</option><option value="available" ${p.availability==='available'?'selected':''}>Available</option><option value="unavailable" ${p.availability==='unavailable'?'selected':''}>Unavailable</option></select></div>`).join(''):'<div class="club-empty">Add players in the Squad tab first.</div>'}</section>`}
function setAvailability(id,value){let p=club.players.find(p=>p.id===id);if(p){p.availability=value;clubSave()}}
function trainingAdd(){const title=document.getElementById('session-title').value.trim(),date=document.getElementById('session-date').value,time=document.getElementById('session-time').value,venue=document.getElementById('session-venue').value.trim(),focus=document.getElementById('session-focus').value.trim();if(!title||!date)return alert('Enter a session name and date.');club.sessions.push({id:'s'+Date.now(),title,date,time,venue,focus});clubSave()}
function trainingDelete(id){if(confirm('Delete this team training session?')){club.sessions=club.sessions.filter(x=>x.id!==id);clubSave()}}
function sessionsView(){return `<div class="section-head"><div class="club-kicker">TEAM CALENDAR</div><h2>TEAM TRAINING</h2><p>Add and manage upcoming field sessions separately from your own gym program.</p></div><section class="card"><h3>Schedule a session</h3><label>Session name</label><input id="session-title" placeholder="e.g. Team field training"><div class="grid2"><div><label>Date</label><input id="session-date" type="date"></div><div><label>Start time</label><input id="session-time" type="time"></div></div><label>Location</label><input id="session-venue" placeholder="Ground / venue"><label>Training focus</label><input id="session-focus" placeholder="Speed, fitness, skills..."><div class="tools"><button class="primary" onclick="trainingAdd()">SAVE SESSION</button></div></section><section class="card"><h3>Scheduled sessions</h3>${club.sessions.length?club.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="club-row"><div><b>${ce(x.title)}</b><div class="club-small">${ce(x.date)} ${ce(x.time||'Time TBC')} · ${ce(x.venue||'Venue TBC')}</div><div class="club-small">${ce(x.focus||'')}</div></div><button class="secondary tinybtn" onclick="trainingDelete('${x.id}')">Remove</button></div>`).join(''):'<div class="club-empty">No team training sessions scheduled yet.</div>'}</section>`}

const statFields=[['games','Games'],['tries','Tries'],['goals','Goals'],['errors','Errors'],['runs','Total runs'],['tackles','Total tackles'],['specialEfforts','Special efforts'],['missedTackles','Missed tackles'],['metres','Total metres']];
function statNumber(st,k){return Math.max(0,Number(st[k])||0)}
function perGame(n,g){return g?(n/g).toFixed(1):'—'}
function tackleEfficiency(st){const made=statNumber(st,'tackles'),missed=statNumber(st,'missedTackles');return made+missed?((made/(made+missed))*100).toFixed(1)+'%':'—'}
function playerStatInputs(id,st){return `<div class="stat-fields">${statFields.map(([k,l])=>`<label>${l}<input type="number" min="0" step="1" value="${statNumber(st,k)}" onchange="updatePlayerStat('${id}','${k}',this.value)"></label>`).join('')}</div>`}
function statMetrics(st){const g=statNumber(st,'games');return `<div class="performance-grid"><div><small>RUNS P/G</small><b>${perGame(statNumber(st,'runs'),g)}</b></div><div><small>METRES P/G</small><b>${perGame(statNumber(st,'tackles'),g)}</b></div><div><small>METRES P/G</small><b>${perGame(statNumber(st,'metres'),g)}</b></div><div><small>TACKLE EFFICIENCY</small><b>${tackleEfficiency(st)}</b></div><div><small>POINTS</small><b>${statNumber(st,'tries')*4+statNumber(st,'goals')*2}</b></div><div><small>SPECIAL EFFORTS</small><b>${statNumber(st,'specialEfforts')}</b></div></div>`}
function statsView(){const totals=club.players.map(p=>({p,stats:club.playerStats[p.id]||{}}));const leading=totals.slice().sort((a,b)=>statNumber(b.stats,'tries')-statNumber(a.stats,'tries'))[0];return `<div class="section-head"><div class="club-kicker">PERFORMANCE · 2027</div><h2>PLAYER STATISTICS</h2><p>Record season totals. Per-game averages and tackle efficiency calculate automatically.</p></div><section class="card"><h3>Season snapshot</h3><div class="mini-grid"><div class="tile"><small>Leading try scorer</small><strong>${leading?statNumber(leading.stats,'tries'):0}</strong><small>${leading?ce(leading.p.name):'No players yet'}</small></div><div class="tile"><small>Squad members</small><strong>${totals.length}</strong><small>First grade</small></div></div></section>${totals.length?totals.map(({p,stats})=>`<section class="card player-stats-card"><div class="line"><h3>${ce(p.name)}</h3><button class="secondary tinybtn" onclick="profileOpen('${p.id}')">PROFILE</button></div>${statMetrics(stats)}<details><summary>Edit season totals</summary>${playerStatInputs(p.id,stats)}<p class="mini">Runs, tackles and metres are entered as season totals; averages use games played. Tackle efficiency = completed tackles ÷ (completed + missed tackles).</p></details></section>`).join(''):'<section class="card">Add players under Team → Squad to start tracking statistics.</section>'}`}
function updatePlayerStat(id,key,value){if(!statFields.some(x=>x[0]===key))return;club.playerStats[id]??={};club.playerStats[id][key]=Math.max(0,Math.floor(Number(value)||0));save();/* No full-screen rerender: prevents jumping while editing. */const card=document.activeElement?.closest('.player-stats-card');if(card){const metrics=card.querySelector('.performance-grid');if(metrics)metrics.outerHTML=statMetrics(combinedStats(id));}const profileMetrics=document.querySelector('.profile-metrics');if(profileMetrics){profileMetrics.innerHTML=statMetrics(combinedStats(id));}}


// Match-by-match ledger. Existing manually entered season totals remain a separate baseline.
club.matchPlayerStats??={};
let activeMatchId=null;
function matchStatsOpen(id){activeMatchId=id;changeTab('matchstats')}
function matchPlayerRow(mid,p){const d=club.matchPlayerStats[mid]?.[p.id]||{};const played=d.played===true;return `<details class="match-player"><summary><span>${ce(p.name)}</span><span class="match-player-status">${played?'PLAYED · '+(Number(d.tries)||0)+' tries':'NOT RECORDED'}</span></summary><div class="match-player-inner"><label class="played-check"><input type="checkbox" ${played?'checked':''} onchange="setMatchPlayed('${mid}','${p.id}',this.checked)"> Played in this match</label><div class="stat-fields">${statFields.filter(x=>x[0]!=='games').map(([k,l])=>`<label>${l}<input type="number" min="0" step="1" value="${statNumber(d,k)}" onchange="setMatchPlayerStat('${mid}','${p.id}','${k}',this.value)"></label>`).join('')}</div><p class="mini">Stats entered here are recorded against this fixture and added to the player's season totals.</p></div></details>`}
function matchStatsView(){const m=club.matches.find(x=>x.id===activeMatchId);if(!m)return `<section class="card"><h2>Match not found</h2><button onclick="changeTab('matches')">Back to matches</button></section>`;const entries=club.matchPlayerStats[m.id]||{};const played=Object.values(entries).filter(x=>x.played).length;return `<div class="section-head"><button class="secondary tinybtn" onclick="changeTab('matches')">← MATCH CENTRE</button><div class="club-kicker" style="margin-top:16px">MATCH PERFORMANCE</div><h2>COMETS VS ${ce(m.opponent)}</h2><p>${ce(m.date)} · ${ce(m.venue||'Venue TBC')}</p></div><section class="card"><div class="line"><h3>Player statistics</h3><span class="pill" id="match-player-count">${played} recorded</span></div><p class="muted">Select each player who took the field, then enter their match totals. Unrecorded players are not counted as having played.</p>${club.players.length?club.players.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>matchPlayerRow(m.id,p)).join(''):'<p>Add players under Team → Squad first.</p>'}</section><section class="card"><h3>Season calculations</h3><p class="mini">Match entries are added to your existing manual totals. If those manual totals already include this game, adjust the manual baseline in Stats to avoid counting it twice.</p><button class="primary" onclick="changeTab('stats')">VIEW UPDATED SEASON STATS</button></section>`}
function setMatchPlayed(mid,pid,checked){club.matchPlayerStats[mid]??={};club.matchPlayerStats[mid][pid]??={};club.matchPlayerStats[mid][pid].played=checked;save();const n=Object.values(club.matchPlayerStats[mid]).filter(x=>x.played).length;const label=document.getElementById('match-player-count');if(label)label.textContent=n+' recorded';const summary=document.activeElement?.closest('details')?.querySelector('.match-player-status');if(summary)summary.textContent=checked?'PLAYED':'NOT RECORDED'}
function setMatchPlayerStat(mid,pid,k,v){if(!statFields.some(x=>x[0]===k&&k!=='games'))return;club.matchPlayerStats[mid]??={};club.matchPlayerStats[mid][pid]??={};club.matchPlayerStats[mid][pid][k]=Math.max(0,Math.floor(Number(v)||0));club.matchPlayerStats[mid][pid].played=true;save();const d=document.activeElement?.closest('details');if(d){const checkbox=d.querySelector('input[type=checkbox]');if(checkbox)checkbox.checked=true;const summary=d.querySelector('.match-player-status');if(summary)summary.textContent='PLAYED · '+statNumber(club.matchPlayerStats[mid][pid],'tries')+' tries'}const label=document.getElementById('match-player-count');if(label)label.textContent=Object.values(club.matchPlayerStats[mid]).filter(x=>x.played).length+' recorded'}
function combinedStats(pid){const base=club.playerStats[pid]||{},combined={};for(const [k] of statFields)combined[k]=statNumber(base,k);for(const [mid,players] of Object.entries(club.matchPlayerStats)){if(!club.matches.some(m=>m.id===mid))continue;const row=players?.[pid];if(!row?.played)continue;combined.games++;for(const [k] of statFields)if(k!=='games')combined[k]+=statNumber(row,k)}return combined}
const priorStatsView=statsView;

y tinybtn" onclick="v6DeleteComment('${n.id}','${c.id}')">Delete</button>`:''}</small></div>`).join('')}<div class="notice-row"><input id="reply-${n.id}" maxlength="500" placeholder="Write a comment..."><button class="primary tinybtn" onclick="v6Reply('${n.id}')">REPLY</button></div></div></section>`).join('')}${!posts.length?'<p class="muted">No announcements yet. Be the first to post.</p>':''}</section>`}

function v6DeleteComment(id,cid){let n=club.announcements.find(x=>x.id===id),c=n?.comments.find(x=>x.id===cid);if(!c||(previewMode!=='coach'&&c.owner!==v6Owner()))return;n.comments=n.comments.filter(x=>x.id!==cid);clubSave()}
function v6Profile(){let p=previewPlayer();if(!p)return '<section class="card"><h3>Choose a player</h3><p>Select a player in the preview switch above to see their training profile.</p></section>';return club.trainingProfiles[p.id]??={weight:'',target:'',goal:'performance',days:'3',experience:'intermediate',equipment:'full',injury:'',generated:null}}
function v6ProfileCard(){let p=previewPlayer();if(!p)return '';let d=v6Profile();return `<section class="card"><div class="club-kicker">MY PLAYER PROFILE</div><h3>My goals & gym program</h3><p class="muted">Your details are private to your training profile in this preview. They won't appear on the team leaderboard.</p><div class="profile-grid"><label>Current weight (kg)<input id="v6-weight" type="number" min="35" max="250" step="0.1" value="${ce(d.weight)}"></label><label>Goal weight (kg)<input id="v6-target" type="number" min="35" max="250" step="0.1" value="${ce(d.target)}"></label><label>Training goal<select id="v6-goal"><option value="performance" ${d.goal==='performance'?'selected':''}>Rugby performance</option><option value="strength" ${d.goal==='strength'?'selected':''}>Strength & power</option><option value="muscle" ${d.goal==='muscle'?'selected':''}>Build muscle</option><option value="conditioning" ${d.goal==='conditioning'?'selected':''}>Conditioning</option></select></label><label>Gym days per week<select id="v6-days">${[2,3,4].map(x=>`<option value="${x}" ${Number(d.days)===x?'selected':''}>${x} days</option>`).join('')}</select></label><label>Experience<select id="v6-experience">${['beginner','intermediate','advanced'].map(x=>`<option ${d.experience===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Equipment<select id="v6-equipment"><option value="full" ${d.equipment==='full'?'selected':''}>Full gym</option><option value="limited" ${d.equipment==='limited'?'selected':''}>Limited equipment</option></select></label></div><label>Injuries or restrictions (optional)</label><textarea id="v6-injury" rows="2" placeholder="Record restrictions; seek clearance before exercising with an injury">${ce(d.injury)}</textarea><button class="primary" onclick="v6Generate()">BUILD MY GYM PROGRAM</button><p class="mini">Sample training templates only, not medical or personalised nutrition advice. Programs need coach review before use.</p></section>${d.generated?v6ProgramView(d):''}`}
function v6Generate(){let d=v6Profile();if(!d)return;let w=Number(document.getElementById('v6-weight').value),t=Number(document.getElementById('v6-target').value);if(!Number.isFinite(w)||!Number.isFinite(t)||w<35||w>250||t<35||t>250)return alert('Enter current and goal weights between 35 and 250 kg.');d.weight=w;d.target=t;d.goal=document.getElementById('v6-goal').value;d.days=document.getElementById('v6-days').value;d.experience=document.getElementById('v6-experience').value;d.equipment=document.getElementById('v6-equipment').value;d.injury=document.getElementById('v6-injury').value.trim();d.generated={created:new Date().toISOString(),days:Number(d.days)};clubSave()}
function v6ProgramView(d){let limited=d.equipment==='limited';let plans=[['Upper-body strength',[limited?'Push-ups / DB press':'Bench press', 'Single-arm row','Overhead press','Pull-ups or pulldown','Core holds']],['Lower-body strength',[limited?'Goblet squat':'Squat','Romanian deadlift','Split squat','Calf raises','Side plank']],['Full-body power',['Jump or fast step-up','DB or barbell push press','Horizontal row','Hip hinge','Farmer carry']],['Optional conditioning',['Bike or brisk intervals','Mobility circuit','Core stability','Easy aerobic recovery']]];let days=Number(d.days);let set=d.experience==='beginner'?'2–3 sets': '3 sets';return `<section class="card"><div class="club-kicker">SAMPLE GYM PLAN · COACH REVIEW REQUIRED</div><h3>${ce(d.goal.charAt(0).toUpperCase()+d.goal.slice(1))} · ${days} days/week</h3><p class="muted">Keep hard lower-body sessions away from match day where possible. Adapt around team training and recovery.</p>${d.injury?'<div class="v6-banner"><b>Restriction recorded:</b> Do not begin until your coach and an appropriate health professional have reviewed your restrictions.</div>':''}${plans.slice(0,days).map(([name,ex],i)=>`<div class="program-day"><h4>Session ${i+1} · ${name}</h4>${ex.map(x=>`<p>• ${ce(x)} — ${set} × 5–10 controlled reps${x.includes('interval')?' / suitable intervals':''}</p>`).join('')}</div>`).join('')}<p class="mini">Start conservatively; adjust load to technique and recovery. Goal weight is used for progress tracking, not automatic calorie targets.</p></section>`}
const v6OldPlayerTraining=playerTraining;
playerTraining=function(){return v6ProfileCard()+v6OldPlayerTraining()};
const v6OldCoachHome=home,v6OldPlayerHome=playerHome;
home=function(){return v6OldCoachHome().replace('<div class="home-links">',noticeboard(true)+'<div class="home-links">')};
playerHome=function(){return v6OldPlayerHome().replace('<div class="overview-row">',noticeboard(true)+'<div class="overview-row">')};
const v6OldRender=render;
render=function(){if(state.tab==='announcements'){const modeCoach=previewMode==='coach';document.getElementById('coach-mode-btn').classList.toggle('active',modeCoach);document.getElementById('player-mode-btn').classList.toggle('active',!modeCoach);document.querySelector('.athlete').textContent=modeCoach?'MACAULEY DAWSON':'FIRST GRADE · PLAYER PORTAL';document.getElementById('preview-warning').innerHTML=modeCoach?'<b>COACH PREVIEW</b> · Local data only.':`<b>PLAYER PREVIEW</b> · No secure login yet. <label for="preview-player">Viewing as</label> <select id="preview-player" onchange="setPreviewPlayer(this.value)"><option value="">Choose player</option>${club.players.map(p=>`<option value="${ce(p.id)}" ${previewPlayerId===p.id?'selected':''}>${ce(p.name)}</option>`).join('')}</select>`;document.getElementById('tabs').innerHTML=[['home','Home'],['team','Team'],['matches','Matches'],['stats','Stats'],['training',modeCoach?'Training':'My Training']].map(([id,label])=>`<button onclick="changeTab('${id}')">${label}</button>`).join('');document.getElementById('app').innerHTML=`<div class="section-head"><div class="club-kicker">COMETS HQ · 2027</div><h2>THE SIDELINE · ANNOUNCEMENTS</h2></div>${noticeboard(false)}`;return}v6OldRender()};

state.tab='home';save();

render();
